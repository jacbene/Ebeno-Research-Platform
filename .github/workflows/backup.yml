name: Daily Database Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GPG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg
          gpg --version | head -1

      - name: Pull postgres:18 image
        run: |
          docker pull postgres:18
          docker run --rm postgres:18 pg_dump --version

      - name: Create encrypted database backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -e
          set -o pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "❌ DATABASE_URL non défini"
            exit 1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "❌ BACKUP_PASSPHRASE non défini"
            exit 1
          fi

          TIMESTAMP=$(date +%Y%m%d_%H%M)
          FILENAME="backup_${TIMESTAMP}.sql.gz.gpg"

          # ═══════════════════════════════════════════════════
          # 1. Réveil de Neon (scale-to-zero)
          # ═══════════════════════════════════════════════════
          echo "═══════════════════════════════════════════"
          echo "1. Réveil de Neon + test connexion"
          echo "═══════════════════════════════════════════"

          MAX_ATTEMPTS=5
          ATTEMPT=0
          CONNECTED=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Tentative $ATTEMPT / $MAX_ATTEMPTS..."
            if docker run --rm \
                 -e DATABASE_URL="$DATABASE_URL" \
                 postgres:18 \
                 psql "$DATABASE_URL" -c "SELECT 1;" >/dev/null 2>&1; then
              CONNECTED=1
              echo "✅ Connexion établie"
              break
            fi
            echo "⚠️  Échec, retry dans 5s..."
            sleep 5
          done

          if [ "$CONNECTED" -ne 1 ]; then
            echo "❌ Impossible de se connecter après $MAX_ATTEMPTS tentatives"
            docker run --rm -e DATABASE_URL="$DATABASE_URL" postgres:18 \
              psql "$DATABASE_URL" -c "SELECT 1;" || true
            exit 1
          fi

          echo ""
          echo "Version serveur :"
          docker run --rm -e DATABASE_URL="$DATABASE_URL" postgres:18 \
            psql "$DATABASE_URL" -c "SHOW server_version;"

          # ═══════════════════════════════════════════════════
          # 2. Dump chiffré (pg_dump 18 dans Docker)
          # ═══════════════════════════════════════════════════
          echo ""
          echo "═══════════════════════════════════════════"
          echo "2. Création du dump chiffré (pg_dump 18)"
          echo "═══════════════════════════════════════════"

          # Pipe : Docker pg_dump → gzip → gpg → fichier local
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            postgres:18 \
            pg_dump --no-owner --no-privileges "$DATABASE_URL" \
            | gzip -9 \
            | gpg --symmetric \
                  --cipher-algo AES256 \
                  --batch --yes \
                  --passphrase "$BACKUP_PASSPHRASE" \
                  --output "$FILENAME"

          SIZE=$(du -h "$FILENAME" | cut -f1)
          SIZE_BYTES=$(stat -c%s "$FILENAME")

          echo "✅ Backup chiffré : $FILENAME ($SIZE / $SIZE_BYTES bytes)"

          if [ "$SIZE_BYTES" -lt 10000 ]; then
            echo "❌ ERREUR : backup trop petit ($SIZE)"
            exit 1
          fi

          # ═══════════════════════════════════════════════════
          # 3. Vérif chiffrement (magic bytes GPG)
          # ═══════════════════════════════════════════════════
          FILE_HEADER=$(head -c 2 "$FILENAME" | xxd -p)
          if [ "$FILE_HEADER" != "8c0d" ]; then
            echo "⚠️  Header $FILE_HEADER (attendu 8c0d)"
          else
            echo "✅ Chiffrement GPG confirmé"
          fi

          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "SIZE=$SIZE" >> $GITHUB_ENV

      - name: Upload encrypted backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.FILENAME }}
          retention-days: 30
          compression-level: 0

      - name: Summary
        if: success()
        run: |
          echo "## ✅ Backup réussi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Fichier** : \`${{ env.FILENAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Taille** : ${{ env.SIZE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Chiffrement** : AES256 (GPG)" >> $GITHUB_STEP_SUMMARY
          echo "- **pg_dump** : 18 (via Docker)" >> $GITHUB_STEP_SUMMARY
          echo "- **Rétention** : 30 jours" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔓 Restauration" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "gpg --decrypt --batch --passphrase \"\$BACKUP_PASSPHRASE\" ${{ env.FILENAME }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  | gunzip | psql \"\$DATABASE_URL\"" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Summary (échec)
        if: failure()
        run: |
          echo "## ❌ Backup échoué" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Vérifiez les logs ci-dessus." >> $GITHUB_STEP_SUMMARY
