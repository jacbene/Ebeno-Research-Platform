name: Daily Database Backup

on:
  schedule:
    # 3h UTC = 4h Cameroun (heure creuse)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Create database backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_EXTERNAL }}
        run: |
          set -e
          TIMESTAMP=$(date +%Y%m%d_%H%M)
          FILENAME="backup_${TIMESTAMP}.sql.gz"

          echo "🔍 Test de connexion..."
          psql "$DATABASE_URL" -c "SELECT version();" | head -3

          echo "📦 Création du backup..."
          pg_dump "$DATABASE_URL" --no-owner --no-privileges --clean --if-exists | gzip > "$FILENAME"

          SIZE=$(du -h "$FILENAME" | cut -f1)
          echo "✅ Backup créé : $FILENAME ($SIZE)"

          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "SIZE=$SIZE" >> $GITHUB_ENV

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.FILENAME }}
          retention-days: 90
          compression-level: 0 # Déjà gzippé

      - name: Summary
        if: success()
        run: |
          echo "### ✅ Backup réussi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Fichier** : \`${{ env.FILENAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Taille** : ${{ env.SIZE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Rétention** : 90 jours" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Téléchargeable depuis **Actions → cette run → Artifacts**" >> $GITHUB_STEP_SUMMARY

      - name: Failure notification
        if: failure()
        run: |
          echo "### ❌ Backup échoué" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Vérifier les logs ci-dessus." >> $GITHUB_STEP_SUMMARY
# Auto-detected by GitHub Actions
