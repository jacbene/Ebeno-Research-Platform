name: Daily Database Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL 18 client + GPG
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 gnupg
          pg_dump --version
          gpg --version | head -1

      - name: Create encrypted database backup
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGSSLMODE: require
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -e
          set -o pipefail

          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "❌ ERREUR : BACKUP_PASSPHRASE non défini dans les secrets GitHub"
            exit 1
          fi

          TIMESTAMP=$(date +%Y%m%d_%H%M)
          FILENAME="backup_${TIMESTAMP}.sql.gz.gpg"

          echo "═══════════════════════════════════════════"
          echo "1. Test de connexion à $PGHOST"
          echo "═══════════════════════════════════════════"
          psql -c "SELECT current_database(), current_user;"
          psql -c "SHOW server_version;"

          echo ""
          echo "═══════════════════════════════════════════"
          echo "2. Création du dump chiffré"
          echo "═══════════════════════════════════════════"

          pg_dump --no-owner --no-privileges \
            | gzip -9 \
            | gpg --symmetric \
                  --cipher-algo AES256 \
                  --batch --yes \
                  --passphrase "$BACKUP_PASSPHRASE" \
                  --output "$FILENAME"

          SIZE=$(du -h "$FILENAME" | cut -f1)
          SIZE_BYTES=$(stat -c%s "$FILENAME")

          echo "✅ Backup chiffré créé : $FILENAME ($SIZE / $SIZE_BYTES bytes)"

          if [ "$SIZE_BYTES" -lt 10000 ]; then
            echo "❌ ERREUR : backup trop petit ($SIZE)"
            exit 1
          fi

          echo ""
          echo "═══════════════════════════════════════════"
          echo "3. Vérification du chiffrement"
          echo "═══════════════════════════════════════════"
          FILE_HEADER=$(head -c 2 "$FILENAME" | xxd -p)
          if [ "$FILE_HEADER" != "8c0d" ]; then
            echo "⚠️  Attention : header $FILE_HEADER (attendu 8c0d)"
          else
            echo "✅ Fichier bien chiffré (magic bytes GPG détectés)"
          fi

          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "SIZE=$SIZE" >> $GITHUB_ENV

      - name: Upload encrypted backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.FILENAME }}
          retention-days: 30
          compression-level: 0

      - name: Summary
        if: success()
        run: |
          echo "## ✅ Backup réussi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Fichier** : \`${{ env.FILENAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Taille** : ${{ env.SIZE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Chiffrement** : AES256 (GPG)" >> $GITHUB_STEP_SUMMARY
          echo "- **Rétention** : 30 jours" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔓 Restauration" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "gpg --decrypt --batch --passphrase \"\$BACKUP_PASSPHRASE\" ${{ env.FILENAME }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  | gunzip | psql \"\$DIRECT_URL\"" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
