name: Daily Database Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          pg_dump --version

      - name: Create database backup
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGSSLMODE: require
        run: |
          set -e
          set -o pipefail
          TIMESTAMP=$(date +%Y%m%d_%H%M)
          FILENAME="backup_${TIMESTAMP}.sql.gz"

          echo "Test de connexion a $PGHOST..."
          psql -c "SELECT current_database(), current_user;"

          echo ""
          echo "Version du serveur :"
          psql -c "SHOW server_version;"

          echo ""
          echo "Version du client pg_dump :"
          pg_dump --version

          echo ""
          echo "Creation du backup..."
          pg_dump --no-owner --no-privileges | gzip > "$FILENAME"

          SIZE=$(du -h "$FILENAME" | cut -f1)
          SIZE_BYTES=$(stat -c%s "$FILENAME")

          echo "Backup cree : $FILENAME ($SIZE)"

          if [ "$SIZE_BYTES" -lt 10000 ]; then
            echo "ERREUR : backup trop petit ($SIZE)"
            gunzip -c "$FILENAME" | head -30
            exit 1
          fi

          echo "Taille OK : $SIZE"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "SIZE=$SIZE" >> $GITHUB_ENV

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.FILENAME }}
          retention-days: 90
