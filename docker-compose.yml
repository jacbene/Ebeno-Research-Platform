version: '3.8'

services:
  # --- Base de données PostgreSQL locale ---
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ebeno
      POSTGRES_PASSWORD: ebeno_secret
      POSTGRES_DB: ebeno_db
    volumes:
      - ebeno_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebeno -d ebeno_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- IA Locale (Ollama) ---
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  # --- Téléchargement automatique du modèle IA au premier démarrage ---
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "OLLAMA_HOST=http://ollama:11434 ollama pull llama3.1"
    restart: "no"
    # Décommente si GPU NVIDIA :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

# --- Whisper Local (transcription audio souveraine) ---
whisper:
  image: onerahmet/openai-whisper-asr-webservice:latest
  container_name: ebeno-whisper
  environment:
    - ASR_MODEL=${WHISPER_LOCAL_MODEL:-base}
    - ASR_ENGINE=faster_whisper
    - ASR_LANG=fr
  volumes:
    - whisper_models:/root/.cache/huggingface
  ports:
    - "9000:9000"
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:9000/docs"]
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 120s

whisper-init:
  image: onerahmet/openai-whisper-asr-webservice:latest
  container_name: ebeno-whisper-init
  depends_on:
    whisper:
      condition: service_healthy
  entrypoint: >
    sh -c "
      echo '✅ Whisper Local prêt (modèle ${WHISPER_LOCAL_MODEL:-base})' &&
      exit 0
    "
  restart: "no"

  # --- MinIO (stockage fichiers S3-compatible) ---
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ebeno-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3 (utilisée par le backend)
      - "9001:9001"   # Console web (accès admin)
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- Init MinIO : crée le bucket une seule fois ---
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ebeno-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-ebeno-files} &&
      echo '✅ MinIO bucket ready'
      "
    restart: "no"

  # --- Backend Node.js ---
  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgres://ebeno:ebeno_secret@db:5432/ebeno_db
      JWT_SECRET: change_me_in_production
      # IA locale
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1
      # Stockage : Cloudinary ou MinIO
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ebeno-files}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      # Transcription locale (souveraineté)
      WHISPER_LOCAL_URL: http://whisper:9000
      WHISPER_LOCAL_MODEL: ${WHISPER_LOCAL_MODEL:-base}
      WHISPER_LOCAL_LANG: ${WHISPER_LOCAL_LANG:-fr}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      whisper-init:
        condition: service_completed_successfully
    ports:
      - "5001:5001"
    restart: unless-stopped

  # --- Frontend (Nginx) ---
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  ebeno_db_data:
  ollama_data:
  minio_data:
  whisper_models:
