<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Base du chapeau (bleu foncé) -->
  <path d="M 120 220 L 120 360 C 120 420 392 420 392 360 L 392 220 Z" fill="#3651B5" />
  
  <!-- Plateau du chapeau (bleu principal) -->
  <polygon points="256,40 490,160 256,280 22,160" fill="#4A6CF7" />
  
  <!-- Bouton central sur le plateau -->
  <circle cx="256" cy="150" r="15" fill="#3651B5" />
  
  <!-- Cordon doré qui pend à DROITE -->
  <path d="M 42 170 Q 22 280 62 390" fill="none" stroke="#FFC107" stroke-width="12" stroke-linecap="round" />
  
  <!-- Pompon au bout du cordon (à droite) -->
  <rect x="47" y="390" width="30" height="50" rx="5" fill="#FFD700" />
  <path d="M 47 440 L 77 440 L 62 480 Z" fill="#FFD700" />
</svg>
